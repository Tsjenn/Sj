name: Deploy store to GitHub Pages

# Publishes ONLY the site/ folder. Product files in products/ and dist/
# are never deployed, so paid downloads stay private.

# Deploys run from the repository's DEFAULT branch
# (claude/passive-income-app-3tbboh): GitHub created the github-pages
# environment restricted to the default branch, so runs triggered from
# main are rejected before they start. If the default branch is ever
# switched to main in Settings, change the branch below to main too.
on:
  push:
    branches: [claude/passive-income-app-3tbboh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
