name: Daily social post

on:
  schedule:
    - cron: "17 13 * * *"    # once a day, 13:17 UTC ≈ morning US / evening Asia
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests requests-oauthlib

      - name: Post next queued item
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python scripts/post_social.py

      - name: Save queue position
        run: |
          if ! git diff --quiet social/queue.json; then
            git config user.name "social-bot"
            git config user.email "actions@users.noreply.github.com"
            git add social/queue.json
            git commit -m "Advance social queue [skip ci]"
            git push
          else
            echo "Queue unchanged; nothing to commit."
          fi
