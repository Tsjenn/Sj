<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Critter Beat</title>
<meta name="description" content="Tap the falling critters on the beat — your taps play the song. How long can you keep the groove?">
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#241F33;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  #c { display:block; width:100vw; height:100vh; }
  .ui { position:fixed; left:0; right:0; text-align:center; color:#FFF4E4; pointer-events:none; }
  #score { top:max(2.4vh, env(safe-area-inset-top)); font-size:min(11vw,54px); font-weight:800;
    text-shadow:0 2px 8px rgba(10,8,20,.5); }
  #combo { top:calc(max(2.4vh, env(safe-area-inset-top)) + min(12vw,60px)); font-size:min(5vw,22px);
    font-weight:700; color:#FFC46B; opacity:0; transition:opacity .2s; }
  #hearts { position:fixed; top:max(2.6vh, env(safe-area-inset-top)); left:14px; font-size:min(5.5vw,24px);
    pointer-events:none; text-shadow:0 2px 6px rgba(10,8,20,.5); }
  #hint { bottom:max(12vh, env(safe-area-inset-bottom)); font-size:min(4.6vw,20px); font-weight:600;
    color:#FFF4E4; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  #mute { position:fixed; top:max(2vh, env(safe-area-inset-top)); right:12px; z-index:5;
    width:44px; height:44px; border:0; border-radius:50%; font-size:20px; cursor:pointer;
    background:rgba(255,244,228,.14); color:#FFF4E4; }
  #gift { position:fixed; top:calc(max(2vh, env(safe-area-inset-top)) + 56px); right:12px;
    z-index:5; display:none; width:52px; height:52px; border:0; border-radius:50%;
    font-size:24px; cursor:pointer; background:#8B7CF0; color:#fff;
    animation:glow 1.6s ease-in-out infinite; }
  @keyframes glow { 0%,100% { box-shadow:0 4px 14px rgba(139,124,240,.35); }
    50% { box-shadow:0 4px 22px rgba(139,124,240,.85); } }
  #over { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(16,12,28,.6); }
  #panel { background:#FFF7E8; color:#2A2438; border-radius:22px; padding:30px 34px; text-align:center;
    width:min(84vw,340px); box-shadow:0 18px 50px rgba(10,8,20,.45); }
  #panel h1 { margin:0 0 4px; font-size:1.5rem; }
  #panel .big { font-size:3.4rem; font-weight:800; line-height:1.1; }
  #panel .best { color:#9a8878; font-weight:700; margin-bottom:16px; }
  #panel button { display:block; width:100%; border:0; border-radius:12px; padding:15px;
    font-size:1.05rem; font-weight:800; cursor:pointer; margin-top:10px; min-height:48px; }
  #revive { background:#8B7CF0; color:#fff; display:none; }
  #again { background:#FFC46B; color:#2A2438; }
  #share { background:transparent; color:#2A2438; border:2px solid #2A2438 !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="score">0</div>
<div class="ui" id="combo"></div>
<div id="hearts">❤️❤️❤️</div>
<div class="ui" id="hint">Tap the critters on the beat</div>
<button id="mute">🔊</button>
<button id="gift" title="Watch an ad — get a shield that absorbs 3 misses">🎁</button>
<div id="over"><div id="panel">
  <h1>The music stopped!</h1>
  <div class="big" id="final">0</div>
  <div class="best" id="best">best 0</div>
  <button id="revive">🎬 Watch ad — keep the beat going</button>
  <button id="again">🥁 Play again</button>
  <button id="share">📋 Share my score</button>
</div></div>
<script src="game.js"></script>
</body>
</html>
